name: Selenium Flyer Processor

on:
  workflow_dispatch:
    inputs:
      baseurl:
        description: "URL of the flyer"
        required: true
        type: string
      pages:
        description: "Number of pages to download"
        required: true
        type: number

jobs:
  process-flyer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver

      - name: Run flyer processor
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SHAREPOINT_SITE: ${{ secrets.SHAREPOINT_SITE }}
          SHAREPOINT_FOLDER: ${{ secrets.SHAREPOINT_FOLDER }}
          USE_GITHUB_ACTIONS: "false"
        run: |
          python manage.py download_lidl_prospekt "${{ github.event.inputs.baseurl }}" ${{ github.event.inputs.pages }}

      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: flyer-results
          path: media/handzettel/
