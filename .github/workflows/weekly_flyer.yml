name: "Weekly flyer → SharePoint"

on:
  schedule:
    - cron: "7 5 * * 1"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      DJANGO_SETTINGS_MODULE: prospektprojekt.settings
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: "False"
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      SHAREPOINT_SITE: ${{ secrets.SHAREPOINT_SITE }}
      SHAREPOINT_FOLDER: ${{ secrets.SHAREPOINT_FOLDER }}
      CHROMEDRIVER: /usr/local/bin/chromedriver
      RK_PICK: current
      PYTHONUNBUFFERED: "1"

    strategy:
      fail-fast: false
      matrix:
        include:
          - retailer: lidl
            url: https://rabatt-kompass.de/lidl-prospekte/lidl-prospekt
          - retailer: aldi_nord
            url: https://rabatt-kompass.de/aldi-nord-prospekte/aldi-nord-prospekt
          - retailer: aldi_sued
            url: https://rabatt-kompass.de/aldi-sued-prospekte/aldi-sued-prospekt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else:
            pip install django requests pillow selenium python-dotenv msal
          fi

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Setup Chromedriver
        uses: nanasess/setup-chromedriver@v2

      - name: Preflight
        run: |
          python3 --version
          google-chrome --version || true
          chromedriver --version || true

      - name: Detect pages
        id: detect
        env:
          URL: ${{ matrix.url }}
        shell: bash
        run: |
          set -e
          PAGES=$(python3 - <<'PY'
          import os, re, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          url = os.environ["URL"]
          def configure():
              opts = Options()
              opts.add_argument("--headless=new")
              opts.add_argument("--window-size=1920,1080")
              opts.add_argument("--disable-gpu")
              opts.add_argument("--no-sandbox")
              opts.add_argument("--disable-dev-shm-usage")
              return opts
          def page_url(base, n):
              if "lidl.de" in base:
                  if re.search(r"/page/\\d+", base):
                      return re.sub(r"/page/\\d+", f"/page/{n}", base)
                  parts = base.split("?", 1)
                  path = parts[0].rstrip("/")
                  query = f"?{parts[1]}" if len(parts) == 2 else ""
                  return f"{path}/page/{n}{query}"
              if re.search(r"#page_\\d+", base):
                  return re.sub(r"#page_\\d+", f"#page_{n}", base)
              return f"{base}#page_{n}"
          driver = webdriver.Chrome(options=configure())
          max_pages = 0
          try:
              for n in range(1, 81):
                  u = page_url(url, n)
                  driver.get(u)
                  try:
                      WebDriverWait(driver, 6).until(EC.presence_of_element_located((By.TAG_NAME, "img")))
                      time.sleep(0.4)
                  except Exception:
                      pass
                  found = False
                  for img in driver.find_elements(By.TAG_NAME, "img"):
                      try:
                          src = (img.get_attribute("currentSrc") or img.get_attribute("src") or "").lower()
                          w = int(img.get_attribute("naturalWidth") or 0)
                          h = int(img.get_attribute("naturalHeight") or 0)
                          if ("/public/gimg/" in src and w >= 400 and h >= 600) or (w >= 800 and h >= 1000):
                              found = True
                              break
                      except Exception:
                          pass
                  if found:
                      max_pages = n
                  else:
                      break
          finally:
              driver.quit()
          if max_pages == 0:
              max_pages = 6
          print(max_pages)
          PY
          )
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
          echo "Detected pages: $PAGES"

      - name: Run Django command
        env:
          PAGES: ${{ steps.detect.outputs.pages }}
        run: |
          python3 manage.py download_lidl_prospekt "${{ matrix.url }}" "$PAGES"
