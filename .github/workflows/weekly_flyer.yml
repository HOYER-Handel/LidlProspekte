name: "Weekly flyer → SharePoint"

on:
  schedule:
    # Europe/Berlin 05:07 all year:
    #  - CEST (UTC+2) -> 03:07 UTC
    #  - CET  (UTC+1) -> 04:07 UTC
    - cron: "7 3 * * 1"
    - cron: "7 4 * * 1"
  workflow_dispatch: {} # allow manual run

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      # Django / app
      DJANGO_SETTINGS_MODULE: prospektprojekt.settings
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: "False"

      # SharePoint / Azure
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      SHAREPOINT_SITE: ${{ secrets.SHAREPOINT_SITE }}
      SHAREPOINT_FOLDER: ${{ secrets.SHAREPOINT_FOLDER }}

      # Scraper behavior
      CHROMEDRIVER: /usr/local/bin/chromedriver
      RK_PICK: current
      PYTHONUNBUFFERED: "1"
      PAGES: "60"
      MISS_LIMIT: "3"
      DUP_LIMIT: "2"

    steps:
      # Guard step FIRST: only proceed when local Berlin time is 05:07
      - name: "Guard: only run at 05:07 Europe/Berlin"
        id: guard
        env:
          GH_EVENT: ${{ github.event_name }}
        run: |
          if [ "$GH_EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(TZ=Europe/Berlin date +%H%M)
          echo "Local time Europe/Berlin: $now"
          if [ "$now" = "0507" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          else
            python3 -m pip install django requests pillow selenium python-dotenv msal
          fi

      - name: Setup Google Chrome
        if: steps.guard.outputs.run == 'true'
        uses: browser-actions/setup-chrome@v1

      - name: Setup Chromedriver
        if: steps.guard.outputs.run == 'true'
        uses: nanasess/setup-chromedriver@v2

      - name: Preflight
        if: steps.guard.outputs.run == 'true'
        run: |
          python3 --version
          google-chrome --version || true
          chromedriver --version || true

      - name: Run Django commands
        if: steps.guard.outputs.run == 'true'
        run: |
          python3 manage.py download_lidl_prospekt "https://rabatt-kompass.de/lidl-prospekte/lidl-prospekt" "$PAGES"
          python3 manage.py download_lidl_prospekt "https://rabatt-kompass.de/aldi-nord-prospekte/aldi-nord-prospekt" "$PAGES"
          python3 manage.py download_lidl_prospekt "https://rabatt-kompass.de/aldi-sued-prospekte/aldi-sued-prospekt" "$PAGES"
