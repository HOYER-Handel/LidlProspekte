name: Weekly flyer → SharePoint

on:
  schedule:
    # Jeden Montag 05:07 UTC (Sommer = 07:07 Berlin, Winter = 06:07)
    - cron: "7 5 * * 1"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Falls du requirements.txt hast, nutze die – sonst installiere minimal:
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install django requests pillow selenium python-dotenv msal
          fi

      # Chrome + Chromedriver für Selenium
      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Setup Chromedriver
        uses: nanasess/setup-chromedriver@v2

      # (Optional) Exakte Berlin-Zeit 07:07 via Guard – verhindert Winter/Sommer-Zeitabweichung
      - name: Guard for Berlin time 07:07 Monday
        run: |
          if [ "$(TZ=Europe/Berlin date +'%u %H %M')" != "1 07 07" ]; then
            echo "Not Monday 07:07 Berlin; skipping run."; exit 0; fi

      - name: Run Django command
        env:
          DJANGO_SETTINGS_MODULE: yourproject.settings # ← anpassen!
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"

          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SHAREPOINT_SITE: ${{ secrets.SHAREPOINT_SITE }}
          SHAREPOINT_FOLDER: ${{ secrets.SHAREPOINT_FOLDER }}

          # Optional: Pfad falls dein Code CHROMEDRIVER nutzt
          CHROMEDRIVER: /usr/local/bin/chromedriver
        run: |
          python manage.py <YOUR_CMD> "https://rabatt-kompass.de/lidl-prospekte/lidl-prospekt" 60
