name: Weekly flyer → SharePoint

on:
  schedule:
    - cron: "7 5 * * 1"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.flyer.url }}
      cancel-in-progress: true

    env:
      DJANGO_SETTINGS_MODULE: prospektprojekt.settings
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: "False"

      # Azure / SharePoint
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      SHAREPOINT_SITE: ${{ secrets.SHAREPOINT_SITE }}
      SHAREPOINT_FOLDER: ${{ secrets.SHAREPOINT_FOLDER }}

      # Rabatt-Kompass
      RK_PICK: current
      RK_FORCE_TOPLEVEL: "1"
      FORCE_SCREENSHOT: "1"
      PYTHONUNBUFFERED: "1"
      TZ: Europe/Berlin

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        flyer:
          - {
              url: "https://rabatt-kompass.de/lidl-prospekte/lidl-prospekt",
              pages: 80,
            }
          - {
              url: "https://rabatt-kompass.de/aldi-nord-prospekte/aldi-nord-prospekt",
              pages: 80,
            }
          - {
              url: "https://rabatt-kompass.de/aldi-sued-prospekte/aldi-sued-prospekt",
              pages: 80,
            }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system deps (fonts, nss, gbm)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libgbm1 libasound2 \
            fonts-liberation ttf-freefont fonts-noto-color-emoji
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install django requests pillow selenium python-dotenv msal
          fi

      - name: Setup Google Chrome (stable)
        uses: browser-actions/setup-chrome@v1

      - name: Preflight
        run: |
          python --version
          python - <<'PY'
          import selenium, PIL, sys
          print("selenium", selenium.__version__)
          import PIL; print("Pillow", PIL.__version__)
          PY
          google-chrome --version || true

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run Django command (with retries)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "Attempt $i: ${{ matrix.flyer.url }} pages=${{ matrix.flyer.pages }}"
            # si tu as installé xvfb, tu peux préfixer par: xvfb-run -a
            if python manage.py download_lidl_prospekt "${{ matrix.flyer.url }}" ${{ matrix.flyer.pages }}; then
              echo "Success on attempt $i"; exit 0
            fi
            echo "Attempt $i failed"; sleep 10
          done
          exit 1

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-${{ matrix.flyer.pages }}
          path: |
            *.log
            debug_*.png
