name: Weekly flyer → SharePoint

on:
  schedule:
    # Every Monday at 05:07 UTC (06:07 CET / 07:07 CEST in Berlin)
    - cron: "7 5 * * 1"
  workflow_dispatch: {}

concurrency:
  group: weekly-flyer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: prospektprojekt.settings
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: "False"

      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      SHAREPOINT_SITE: ${{ secrets.SHAREPOINT_SITE }}
      SHAREPOINT_FOLDER: ${{ secrets.SHAREPOINT_FOLDER }}

      CHROMEDRIVER: /usr/local/bin/chromedriver
      RK_PICK: current
      PYTHONUNBUFFERED: "1"
      # For log timestamps (cron remains UTC regardless)
      TZ: Europe/Berlin

      RK_FORCE_TOPLEVEL: "1"
      CI: "true"

    strategy:
      fail-fast: false
      matrix:
        flyer:
          - {
              url: "https://rabatt-kompass.de/lidl-prospekte/lidl-prospekt",
              pages: 80,
            }
          - {
              url: "https://rabatt-kompass.de/aldi-nord-prospekte/aldi-nord-prospekt",
              pages: 80,
            }
          - {
              url: "https://rabatt-kompass.de/aldi-sued-prospekte/aldi-sued-prospekt",
              pages: 80,
            }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install django requests pillow selenium python-dotenv msal
          fi

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Setup Chromedriver
        uses: nanasess/setup-chromedriver@v2

      - name: Preflight
        run: |
          python --version
          google-chrome --version || true
          chromedriver --version || true

      - name: Run Django command
        run: |
          python manage.py download_lidl_prospekt "${{ matrix.flyer.url }}" ${{ matrix.flyer.pages }}
