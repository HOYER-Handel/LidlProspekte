name: Weekly flyer → SharePoint

on:
  schedule:
    #Every Monday at 05:07 UTC (summer ~ 07:07 Berlin, winter ~ 06:07)
    - cron: "7 5 * * 1"
  workflow_dispatch: {} #allow manual start

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install django requests pillow selenium python-dotenv msal
          fi

      # Chrome + Chromedriver for Selenium
      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Setup Chromedriver
        uses: nanasess/setup-chromedriver@v2

      - name: Guard for Berlin time 07:07 Monday
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(TZ=Europe/Berlin date +'%u %H %M')" != "1 07 07" ]; then
            echo "Not Monday 07:07 Berlin; skipping run."; exit 0; fi

      - name: Run Django command(s)
        env:
          DJANGO_SETTINGS_MODULE: prospektprojekt.settings
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "False"

          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SHAREPOINT_SITE: ${{ secrets.SHAREPOINT_SITE }}
          SHAREPOINT_FOLDER: ${{ secrets.SHAREPOINT_FOLDER }}

          RK_PICK: current
        run: |

          python manage.py download_lidl_prospekt "https://rabatt-kompass.de/lidl-prospekte/lidl-prospekt" 60
          python manage.py download_lidl_prospekt "https://rabatt-kompass.de/aldi-nord-prospekte/aldi-nord-prospekt" 60
          python manage.py download_lidl_prospekt "https://rabatt-kompass.de/aldi-sued-prospekte/aldi-sued-prospekt" 60
